<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Nguyen Duc Tin - AI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07061c"/>
      <stop offset="48%" stop-color="#14114a"/>
      <stop offset="100%" stop-color="#2b2c92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6a73ff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#6a73ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dfe7ff" stop-opacity=".0"/>
      <stop offset="35%" stop-color="#c9d6ff" stop-opacity=".75"/>
      <stop offset="70%" stop-color="#8fa8ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8fa8ff" stop-opacity=".0"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0a2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0a2e" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#b7c6ff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3d1ff"/>
    </linearGradient>
    <radialGradient id="tlR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9b94"/><stop offset="1" stop-color="#ff5f57"/></radialGradient>
    <radialGradient id="tlY" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffdc86"/><stop offset="1" stop-color="#febc2e"/></radialGradient>
    <radialGradient id="tlG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7beb8a"/><stop offset="1" stop-color="#28c840"/></radialGradient>
    <linearGradient id="deckFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05041a" stop-opacity="0"/>
      <stop offset="16%" stop-color="#05041a" stop-opacity="1"/>
      <stop offset="84%" stop-color="#05041a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05041a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>

    <clipPath id="round"><rect width="1000" height="260" rx="20"/></clipPath>
    <style>
      .name{font:700 50px -apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:url(#nameGrad);letter-spacing:.3px}
      .role{font:500 16px -apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:#e6ecff}
      .tag{font:500 13.5px 'SF Mono',Menlo,Consolas,'Courier New',monospace;fill:#9db4ff}
      .ttl{font:500 12.5px 'SF Mono',Menlo,Consolas,'Courier New',monospace;fill:#c9d6ff;opacity:.65}
      .chip{font:600 12px -apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:#f6c76b}
      
      .fl1{animation:fl 9s ease-in-out infinite}
      .fl2{animation:fl 12s ease-in-out infinite reverse}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      .tw{animation:tw 3.2s ease-in-out infinite}
      .t1{animation-delay:.8s}.t2{animation-delay:1.6s}.t3{animation-delay:2.4s}
      @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
      .in{animation:inn 1.3s ease-out both}
      .d2{animation-delay:.3s}.d3{animation-delay:.6s}.d4{animation-delay:.9s}
      @keyframes inn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    </style>
